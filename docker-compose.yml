services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medibridge
      POSTGRES_USER: medibridge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - medibridge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibridge -d medibridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_PORT: 8084
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3004}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medibridge
      DB_USER: medibridge
      DB_PASSWORD: ${DB_PASSWORD}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD}
      SEED_DEMO_DATA: "true"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8084/api/v1}
    ports:
      - "3004:3004"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8084/api/v1}
    depends_on:
      - api

volumes:
  medibridge_pg:
