spring:
  datasource:
    url: jdbc:h2:mem:medibridge_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

medibridge:
  jwt:
    secret: test-secret-which-is-at-least-32-chars!!
    expiration-ms: 3600000
  seed:
    enabled: false
